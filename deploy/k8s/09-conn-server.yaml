apiVersion: v1
kind: Service
metadata:
  name: conn-server
  namespace: feature-flags
spec:
  clusterIP: None
  ports:
  - port: 8091
    name: http
    targetPort: 8091
  selector:
    app: conn-server
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conn-server
  namespace: feature-flags
spec:
  serviceName: conn-server
  replicas: 2
  selector:
    matchLabels:
      app: conn-server
  template:
    metadata:
      labels:
        app: conn-server
    spec:
      containers:
      - name: conn-server
        image: feature-flag-conn-server:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          ORDINAL="${HOSTNAME##*-}"
          export SLOT_ID=$(( ORDINAL + 1 ))
          export SERVER_ADDR="http://${POD_IP}:8091"
          echo "[conn-server-k8s] Launching conn-server slot ${SLOT_ID} advertising ${SERVER_ADDR}"
          exec /app/conn-server
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PORT
          value: "8091"
        - name: KAFKA_DELIVERIES_BROKER
          value: "redpanda-deliveries.feature-flags.svc.cluster.local:9092"
        - name: ETCD_ENDPOINTS
          value: "etcd.feature-flags.svc.cluster.local:2379"
        - name: SHARD_COUNT
          value: "3"
        ports:
        - containerPort: 8091
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8091
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8091
          initialDelaySeconds: 5
          periodSeconds: 10
