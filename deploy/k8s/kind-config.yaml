kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: feature-flag-cluster
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 18080
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 30081
    hostPort: 18081
    listenAddress: "127.0.0.1"
    protocol: TCP
