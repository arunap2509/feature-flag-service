apiVersion: v1
kind: Service
metadata:
  name: mgmt-api
  namespace: feature-flags
spec:
  type: NodePort
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
  selector:
    app: mgmt-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mgmt-api
  namespace: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mgmt-api
  template:
    metadata:
      labels:
        app: mgmt-api
    spec:
      containers:
      - name: mgmt-api
        image: feature-flag-mgmt-api:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          value: "postgres://postgres:postgres@postgres.feature-flags.svc.cluster.local:5432/featureflags?sslmode=disable"
        - name: PORT
          value: "8081"
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
