services:
  postgres:
    image: postgres:16-alpine
    container_name: ff-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=5", "-c", "max_wal_senders=5", "-c", "max_slot_wal_keep_size=10GB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: featureflags
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d featureflags"]
      interval: 3s
      timeout: 3s
      retries: 5

  redpanda-control:
    image: redpandadata/redpanda:latest
    container_name: ff-redpanda-control
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-control:9092,external://localhost:19092
      - --smp 1
      - --memory 512M
      - --mode dev-container
    ports:
      - "19092:19092"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  redpanda-deliveries:
    image: redpandadata/redpanda:latest
    container_name: ff-redpanda-deliveries
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19093
      - --advertise-kafka-addr internal://redpanda-deliveries:9092,external://localhost:19093
      - --smp 1
      - --memory 1024M
      - --mode dev-container
    ports:
      - "19093:19093"
      - "9093:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  migration:
    image: migrate/migrate:v4.17.0
    container_name: ff-migration
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mgmt-api:
    build:
      context: .
      dockerfile: Dockerfile.mgmt-api
    container_name: ff-mgmt-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable"
      PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  outbox-pub:
    build:
      context: .
      dockerfile: Dockerfile.outbox-pub
    container_name: ff-outbox-pub
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable"
      KAFKA_BROKER: "redpanda-control:9092"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-control:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: ff-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 5

  evaluator:
    build:
      context: .
      dockerfile: Dockerfile.evaluator
    container_name: ff-evaluator
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      PORT: "9001"
      NODE_ID: "evaluator-1"
      NODE_ADDR: "http://evaluator:9001"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable"
      KAFKA_BROKER: "redpanda-control:9092"
      KAFKA_DELIVERIES_BROKER: "redpanda-deliveries:9092"
      ETCD_ENDPOINTS: "etcd:2379"
      SHARD_COUNT: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-control:
        condition: service_healthy
      redpanda-deliveries:
        condition: service_healthy
      etcd:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  evaluator-2:
    build:
      context: .
      dockerfile: Dockerfile.evaluator
    container_name: ff-evaluator-2
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      PORT: "9002"
      NODE_ID: "evaluator-2"
      NODE_ADDR: "http://evaluator-2:9002"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable"
      KAFKA_BROKER: "redpanda-control:9092"
      KAFKA_DELIVERIES_BROKER: "redpanda-deliveries:9092"
      ETCD_ENDPOINTS: "etcd:2379"
      SHARD_COUNT: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-control:
        condition: service_healthy
      redpanda-deliveries:
        condition: service_healthy
      etcd:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  evaluator-3:
    build:
      context: .
      dockerfile: Dockerfile.evaluator
    container_name: ff-evaluator-3
    restart: unless-stopped
    ports:
      - "9003:9003"
    environment:
      PORT: "9003"
      NODE_ID: "evaluator-3"
      NODE_ADDR: "http://evaluator-3:9003"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/featureflags?sslmode=disable"
      KAFKA_BROKER: "redpanda-control:9092"
      KAFKA_DELIVERIES_BROKER: "redpanda-deliveries:9092"
      ETCD_ENDPOINTS: "etcd:2379"
      SHARD_COUNT: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-control:
        condition: service_healthy
      redpanda-deliveries:
        condition: service_healthy
      etcd:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  conn-server:
    build:
      context: .
      dockerfile: Dockerfile.conn-server
    container_name: ff-conn-server
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      PORT: "8091"
      SLOT_ID: "1"
      SERVER_ADDR: "http://conn-server:8091"
      KAFKA_DELIVERIES_BROKER: "redpanda-deliveries:9092"
      ETCD_ENDPOINTS: "etcd:2379"
      SHARD_COUNT: "3"
    depends_on:
      redpanda-deliveries:
        condition: service_healthy
      etcd:
        condition: service_healthy
      evaluator:
        condition: service_started
      evaluator-2:
        condition: service_started
      evaluator-3:
        condition: service_started

  conn-server-2:
    build:
      context: .
      dockerfile: Dockerfile.conn-server
    container_name: ff-conn-server-2
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      PORT: "8092"
      SLOT_ID: "2"
      SERVER_ADDR: "http://conn-server-2:8092"
      KAFKA_DELIVERIES_BROKER: "redpanda-deliveries:9092"
      ETCD_ENDPOINTS: "etcd:2379"
      SHARD_COUNT: "3"
    depends_on:
      redpanda-deliveries:
        condition: service_healthy
      etcd:
        condition: service_healthy
      evaluator:
        condition: service_started
      evaluator-2:
        condition: service_started
      evaluator-3:
        condition: service_started

volumes:
  postgres_data:
